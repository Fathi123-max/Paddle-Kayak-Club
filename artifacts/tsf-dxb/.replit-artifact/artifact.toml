kind = "web"
previewPath = "/"
title = "TSF DXB - Stand-Up Paddle & Kayak Club"
version = "1.0.0"
id = "artifacts/tsf-dxb"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19857

[services.development]
run = "pnpm --filter @workspace/tsf-dxb run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tsf-dxb", "run", "build" ]
publicDir = "artifacts/tsf-dxb/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19857"
BASE_PATH = "/"
